name: Docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --group docs
      - name: Check generated reference pages are in sync
        run: uv run python docs/gen_ref_pages.py --check
      - run: uv run mkdocs build --strict

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked --group docs

      - name: Configure git identity for mike
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bootstrap gh-pages on first run
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages branch missing — seeding initial version."
            uv run mike deploy --push --update-aliases 0.6.0 latest
            uv run mike set-default --push latest
          else
            git fetch origin gh-pages --depth=1
            if ! git cat-file -e origin/gh-pages:versions.json 2>/dev/null; then
              echo "gh-pages exists but has no versions.json — seeding initial version."
              uv run mike deploy --push --update-aliases 0.6.0 latest
              uv run mike set-default --push latest
            fi
          fi

      - name: Deploy dev alias (push to main)
        if: github.ref == 'refs/heads/main'
        run: uv run mike deploy --push --update-aliases dev

      - name: Deploy release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          uv run mike deploy --push --update-aliases "$VERSION" latest
          uv run mike set-default --push latest

      - name: Check out gh-pages for Pages artefact
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-site

      - id: deployment
        uses: actions/deploy-pages@v4
