[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cairn"
version = "0.6.0"
description = "A personal LLM harness built around a companion at its centre."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "platformdirs>=4.0",
    "keyring>=25.0",
    "watchfiles>=1.0",
    "anthropic>=0.49,<1",
    "openai>=1.75,<2",
    "tiktoken>=0.9",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "truststore>=0.9",
]

[project.scripts]
cairn = "cairn.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "pyright>=1.1",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mike>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.ruff]
target-version = "py313"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src"]
reportPrivateUsage = "warning"
reportUnusedFunction = "warning"
